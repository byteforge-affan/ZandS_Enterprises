<style>
  .zs-404 {
    padding-top: var(--zs-nav-clearance);
    background: var(--zs-cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
  }

  .zs-404-inner {
    position: relative;
    width: 100%;
    padding: 64px 0 90px;
    text-align: center;
    overflow: hidden;
  }

  /* faint dot-grid field behind the numeral, consistent with the site's
     other full-bleed hero treatments */
  .zs-404-field {
    position: absolute;
    inset: -10% -5% auto -5%;
    height: 480px;
    background-image: radial-gradient(var(--zs-line-soft) 1px, transparent 1px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 30%, #000 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 60% 55% at 50% 30%, #000 0%, transparent 75%);
    pointer-events: none;
  }

  .zs-404-content {
    position: relative;
    max-width: 620px;
    margin: 0 auto;
  }

  .zs-404-eyebrow {
    justify-content: center;
  }

  .zs-404-numeral {
    margin: 22px 0 6px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(96px, 20vw, 190px);
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--zs-charcoal);
    background: linear-gradient(180deg, var(--zs-gold) 0%, var(--zs-mocha-warm) 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  /* subtle die-cut notch flanking the numeral — a small nod to packaging
     structure lines, not a literal illustration */
  .zs-404-crease {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .zs-404-crease span {
    width: 44px;
    height: 1px;
    background: var(--zs-gold-line);
  }

  .zs-404-crease svg { color: var(--zs-mocha-warm); flex-shrink: 0; }

  .zs-404-title {
    font-size: clamp(26px, 3.6vw, 38px);
  }

  .zs-404-text {
    margin: 18px auto 0;
    max-width: 460px;
    font-size: 16px;
    line-height: 1.7;
    color: var(--zs-charcoal-soft);
  }

  .zs-404-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 36px;
  }

  /* ---- entrance animation ---- */
  .zs-404-reveal {
    opacity: 0;
    transform: translateY(16px);
    animation: zs404FadeUp 700ms var(--zs-ease) forwards;
  }

  .zs-404-reveal--1 { animation-delay: 60ms; }
  .zs-404-reveal--2 { animation-delay: 160ms; }
  .zs-404-reveal--3 { animation-delay: 260ms; }
  .zs-404-reveal--4 { animation-delay: 340ms; }
  .zs-404-reveal--5 { animation-delay: 420ms; }

  @keyframes zs404FadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .zs-404-reveal {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }

  @media (max-width: 560px) {
    .zs-404-field { height: 360px; }
    .zs-404-actions { flex-direction: column; }
    .zs-404-actions .zs-btn { width: 100%; }
  }
